<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#c74248">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="description" content="1,025문항의 설명 퀴즈와 사진 퀴즈로 즐기는 포켓몬 도감.">
  <title>누구일까? · 포켓몬 도감 퀴즈</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <link rel="stylesheet" href="./pokedex.css?v=20261017-clue-fix">
</head>
<body>
  <!-- POKEDEX_CLUE_QUIZ_20261017 -->
  <main id="app" class="game-root">
    <section id="startScreen" class="scene start-scene active" aria-labelledby="gameTitle">
      <div class="start-panel">
        <div class="start-top"><span class="status-light" aria-hidden="true"></span><span class="dex-brand">포켓몬 도감</span><button id="titleMusicButton" class="music-button cursor-interaction title-music-btn" type="button" aria-pressed="false">♪</button></div>

        <div class="start-display">
          <div class="start-copy">
            <h1 id="gameTitle">누구일까?</h1><p>포켓몬을 보고 이름을 맞혀봐!</p>
          </div>

          <div class="starter-stage dex-hero" role="group" aria-label="포켓몬을 누르면 반응해">
  <button type="button" class="hero-slot hero-left cursor-interaction" aria-label="왼쪽 포켓몬"><img alt="" width="150" height="150" /></button>
  <button type="button" class="hero-slot hero-center cursor-interaction" aria-label="가운데 포켓몬"><img alt="" width="210" height="210" /></button>
  <button type="button" class="hero-slot hero-right cursor-interaction" aria-label="오른쪽 포켓몬"><img alt="" width="150" height="150" /></button>
</div>

        </div>

        <div class="start-controls">
<div class="quiz-mode-switch" role="group" aria-label="퀴즈 방식">
  <button type="button" class="cursor-interaction" data-quiz-mode="description" aria-pressed="true">설명 퀴즈</button>
  <button type="button" class="cursor-interaction" data-quiz-mode="photo" aria-pressed="false">사진 퀴즈</button>
</div>

          

          <details id="gameOptions" class="game-options">
            <summary class="cursor-interaction">
  <span class="settings-heading">퀴즈 설정</span>
  <span class="option-chevron" aria-hidden="true">⌄</span>
  <span id="optionSummaryText" class="settings-summary" aria-live="polite">10문제 · 3초</span>
</summary>


            <div class="options-body">
              <div class="option-group">
                <div class="menu-label">문제 수</div>
                <div id="countButtons" class="count-menu" role="radiogroup" aria-label="문제 수 선택">
                  <button class="cursor-interaction count-btn" data-count="5" role="radio" aria-checked="false"><span>5</span>문제</button>
                  <button class="cursor-interaction count-btn selected" data-count="10" role="radio" aria-checked="true"><span>10</span>문제</button>
                  <button class="cursor-interaction count-btn" data-count="20" role="radio" aria-checked="false"><span>20</span>문제</button>
                  <button class="cursor-interaction count-btn" data-count="30" role="radio" aria-checked="false"><span>30</span>문제</button>
                </div>
              </div>

              <div class="option-group">
                <div class="menu-label">제한 시간</div>
                <div id="timeButtons" class="time-menu" role="radiogroup" aria-label="문제당 제한 시간 선택">
                  <button class="cursor-interaction time-btn selected" data-time="3" role="radio" aria-checked="true">3초</button>
                  <button class="cursor-interaction time-btn" data-time="5" role="radio" aria-checked="false">5초</button>
                  <button class="cursor-interaction time-btn" data-time="10" role="radio" aria-checked="false">10초</button>
                </div>
              </div>
            </div>
          </details>

          <button id="startButton" class="cursor-interaction start-btn"><span class="cursor">▶</span> 퀴즈 시작</button>
        </div>
      </div>
    </section>

    <section id="quizScreen" class="scene quiz-scene" aria-label="포켓몬 퀴즈">
      <div class="game-frame">
        <header class="hud">
          <button id="homeButton" class="cursor-interaction hud-btn" aria-label="처음 화면으로">처음</button>
          <div class="hud-center">
            <span class="hud-label">문제</span>
            <strong><span id="questionNow">1</span>/<span id="questionTotal">10</span></strong>
          </div>
          <div class="hud-score">
            <span class="hud-label">정답</span>
            <strong id="scoreText">0</strong>
          </div>
          <button id="soundButton" class="music-button cursor-interaction hud-btn sound" aria-label="소리 끄기">♪</button>
        </header>

        <div class="progress-line" aria-hidden="true"><div id="progressBar" class="progress-fill"></div></div>

        <div id="battleField" class="battle-stage">
          <div class="streak-line">연속 정답 <strong id="streakText">0</strong></div>

          <div id="pokemonCard" class="pokemon-stage" aria-live="polite">
            <div class="scan-grid" aria-hidden="true"></div>
<div id="clueArtwork" class="clue-artwork" hidden><img id="clueSilhouette" alt="정체를 맞혀 볼 포켓몬의 실루엣" draggable="false" /></div>
<div id="cluePrompt" hidden role="group" aria-label="문제 설명" aria-live="polite"></div>
            <div id="loadingBadge" class="loading-badge">포켓몬을 찾는 중…</div>
            <img id="pokemonImage" alt="문제 포켓몬" draggable="false" />
            <div id="sparkLayer" class="spark-layer" aria-hidden="true"></div>
            <div id="feedbackStamp" class="feedback-stamp" aria-live="assertive"></div>
          </div>

          <div class="timer-panel" aria-label="남은 시간">
            <span class="timer-caption">남은 시간</span>
            <div class="timer-track"><div id="timerBar" class="timer-bar"></div></div>
            <span id="timerNumber" class="timer-number" aria-live="off">3</span>
          </div>

          <div class="command-box">
            <div id="messageLine" class="message-line" aria-live="polite">이 포켓몬의 이름은?</div>
            <div id="answers" class="answer-menu" aria-label="정답 보기"></div>
          </div>
        </div>
      </div>
    </section>

    <section id="resultScreen" class="scene result-scene" aria-labelledby="resultTitle">
      <div class="result-panel">
        
        <div class="result-screen">
          <span id="resultBadge" hidden></span>
          <h2 id="resultTitle">퀴즈 완료!</h2>
          <div class="result-score"><strong id="finalScore">0</strong><span id="finalTotal">/10</span></div>
          <p id="resultMessage"></p>
          <div class="result-stats">
            <div><span>정답률</span><strong id="accuracyText">0%</strong></div>
            <div><span>최고 연속</span><strong id="bestStreakText">0</strong></div>
          </div>
        </div>
        <section class="dex-review" aria-labelledby="reviewTitle">
  <div class="dex-review-heading"><h3 id="reviewTitle">문제별 결과</h3><span id="reviewCount">0문제</span></div>
  <div class="dex-review-filters" role="group" aria-label="문제 결과 필터">
    <button type="button" class="cursor-interaction" data-review-filter="all" aria-pressed="true">전체</button>
    <button type="button" class="cursor-interaction" data-review-filter="correct" aria-pressed="false">맞힌 문제</button>
    <button type="button" class="cursor-interaction" data-review-filter="wrong" aria-pressed="false">틀린 문제</button>
  </div>
  <div id="reviewList" class="dex-review-list" aria-live="polite"></div>
  <div class="dex-review-pages">
    <button id="reviewPrevious" type="button" class="cursor-interaction" aria-label="이전 문제 목록">이전</button>
    <span id="reviewPage" aria-live="polite">0 / 0</span>
    <button id="reviewNext" type="button" class="cursor-interaction" aria-label="다음 문제 목록">다음</button>
  </div>
</section>

<div class="result-actions">
          <button id="retryButton" class="cursor-interaction menu-action primary">처음으로</button>
          <button hidden id="changeCountButton" class="cursor-interaction menu-action">옵션 바꾸기</button>
        </div>
      </div>
    </section>
  </main>
  <script src="./question-bank.js?v=20261017-clue-fix" defer></script>
  <script src="./pokedex.js?v=20261017-clue-fix" defer></script>
</body>
</html>
