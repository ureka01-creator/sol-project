<!doctype html>
<html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#142b32"><title>구슬 미로 · 0.1.0</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#142b32;color:#f5f1e8;font-family:system-ui,sans-serif;min-height:100dvh}main{max-width:580px;margin:auto;padding: max(18px,env(safe-area-inset-top)) 18px 24px}header{display:flex;align-items:center;justify-content:space-between}h1{font-size:25px;margin:0}small{color:#a8babe;font-size:13px}.stats{display:flex;justify-content:space-between;margin:20px 0 14px;font-variant-numeric:tabular-nums;color:#c6d5d5}.board{position:relative}canvas{display:block;width:100%;border-radius:16px;box-shadow:0 12px 30px #0005;touch-action:none}button{font:inherit;border:1px solid #ffffff28;color:inherit;background:#29434b;padding:12px 15px;border-radius:12px;cursor:pointer;min-height:46px}button:focus-visible{outline:3px solid #ffd172;outline-offset:3px}button.primary{background:#f4bc5e;color:#2b281f;font-weight:700}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:17px}.actions button{flex:1}#hint{min-height:40px;font-size:14px;line-height:1.5;color:#bfd0d0;margin:14px 0}.pad{width:146px;height:146px;border:1px solid #ffffff30;background:#203a43;border-radius:50%;margin:0 auto;position:relative;touch-action:none;user-select:none}.pad:before{content:'↕';position:absolute;inset:8px;text-align:center;color:#a7bfc3;font-size:24px}.pad:after{content:'↔';position:absolute;inset:56px 8px;text-align:center;color:#a7bfc3;font-size:24px}#stick{position:absolute;left:48px;top:48px;width:48px;height:48px;border-radius:50%;background:#f4bc5e;box-shadow:0 4px 10px #0005;z-index:1;pointer-events:none}.foot{text-align:center;font-size:13px;color:#a8babe;margin-top:12px}#result{position:absolute;inset:0;background:#142b32e8;border-radius:16px;display:flex;align-items:center;justify-content:center;text-align:center;padding:24px}#result[hidden]{display:none}#result h2{font-size:30px;margin:0 0 12px}@media(max-height:740px){main{max-width:460px}.pad{width:116px;height:116px}#stick{left:33px;top:33px}.pad:after{inset:42px 8px}.stats{margin:12px 0}#hint{margin:10px 0}}
</style>
<main><header><h1>구슬 미로</h1><small>v0.1.0</small></header><div class="stats"><span>01 · 상자 미로</span><span id="clock">0.0초</span></div><div class="board"><canvas id="game" width="1000" height="1000" aria-label="구슬을 움직여 오른쪽 아래 도착 지점으로 보내세요. 방향키 또는 아래 조작 패드 사용"></canvas><div id="result" hidden><div><h2>도착했어!</h2><p id="score"></p><button class="primary" id="again">한 번 더</button></div></div></div><div class="actions"><button id="motion" class="primary">기울여서 조작</button><button id="reset">처음부터</button></div><p id="hint" role="status">아래 패드를 밀거나 PC 방향키로 움직여봐. 초록색 도착 지점까지 구슬을 보내면 성공!</p><div class="pad" id="pad" role="group" aria-label="터치 조작 패드"><div id="stick"></div></div><p class="foot">천천히 기울일수록 정교하게 움직여.</p></main>
<script>
'use strict';
const canvas=document.querySelector('#game'),ctx=canvas.getContext('2d'),hint=document.querySelector('#hint'),clock=document.querySelector('#clock'),result=document.querySelector('#result'),pad=document.querySelector('#pad'),stick=document.querySelector('#stick');
const W=500,R=10,goal={x:452,y:452},start={x:48,y:48};
// Thin cardboard partitions. Alternating openings make a continuous route.
const walls=[[0,0,500,14],[0,486,500,14],[0,0,14,500],[486,0,14,500],[14,98,380,10],[106,196,380,10],[14,294,380,10],[106,392,380,10],[196,14,10,40],[286,148,10,48],[196,206,10,40],[286,344,10,48],[196,402,10,38]];
let ball,elapsed,won,active,last=0,accumulator=0,axis={x:0,y:0},sensor={x:0,y:0},neutral=null,motion=false,keys=new Set(),pointer=null;
const clamp=(n,a,b)=>Math.max(a,Math.min(b,n));
function reset(){ball={...start,vx:0,vy:0};elapsed=0;won=false;active=false;accumulator=0;axis={x:0,y:0};keys.clear();result.hidden=true;clock.textContent='0.0초';release();}
function collide(b,w){const [x,y,width,height]=w;let dx=b.x-clamp(b.x,x,x+width),dy=b.y-clamp(b.y,y,y+height),d=Math.hypot(dx,dy);if(d>=R)return;if(d===0){const sides=[{d:b.x-x,nx:-1,ny:0},{d:x+width-b.x,nx:1,ny:0},{d:b.y-y,nx:0,ny:-1},{d:y+height-b.y,nx:0,ny:1}].sort((a,b)=>a.d-b.d);const s=sides[0];dx=s.nx;dy=s.ny;b.x+=dx*(R+s.d);b.y+=dy*(R+s.d);}else{dx/=d;dy/=d;b.x+=dx*(R-d);b.y+=dy*(R-d);}const dot=b.vx*dx+b.vy*dy;if(dot<0){b.vx-=1.22*dot*dx;b.vy-=1.22*dot*dy;}}
function step(dt){if(won)return;let x=axis.x,y=axis.y;if(pointer===null&&motion){x=sensor.x;y=sensor.y;}if(keys.size){x=Number(keys.has('ArrowRight'))-Number(keys.has('ArrowLeft'));y=Number(keys.has('ArrowDown'))-Number(keys.has('ArrowUp'));}const len=Math.hypot(x,y);if(len>1){x/=len;y/=len;}if(Math.hypot(x,y)>.06)active=true;if(!active)return;elapsed+=dt;ball.vx=(ball.vx+x*360*dt)*Math.exp(-2.3*dt);ball.vy=(ball.vy+y*360*dt)*Math.exp(-2.3*dt);ball.x+=ball.vx*dt;ball.y+=ball.vy*dt;for(let j=0;j<2;j++)for(const w of walls)collide(ball,w);if(Math.hypot(ball.x-goal.x,ball.y-goal.y)<16){won=true;ball.vx=ball.vy=0;document.querySelector('#score').textContent=elapsed.toFixed(1)+'초 만에 미로 통과!';result.hidden=false;}}
function circle(x,y,r,fill){ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fillStyle=fill;ctx.fill();}
function draw(){ctx.setTransform(2,0,0,2,0,0);ctx.fillStyle='#d7b781';ctx.fillRect(0,0,W,W);ctx.strokeStyle='#b9986430';ctx.lineWidth=1;for(let i=22;i<500;i+=9){ctx.beginPath();ctx.moveTo(14,i);ctx.lineTo(486,i);ctx.stroke();}circle(start.x,start.y,20,'#b5996d');ctx.font='bold 12px system-ui';ctx.textAlign='center';ctx.fillStyle='#493e2d';ctx.fillText('출발',48,79);circle(goal.x,goal.y,25,'#2a7768');circle(goal.x,goal.y,17,'#163e38');ctx.fillStyle='#fff';ctx.fillText('도착',goal.x,goal.y+4);for(const [x,y,w,h] of walls){ctx.fillStyle='#644c3870';ctx.fillRect(x+4,y+5,w,h);ctx.fillStyle='#8e6843';ctx.fillRect(x,y,w,h);ctx.fillStyle='#f0d5a5';ctx.fillRect(x,y,w,Math.min(3,h));}circle(ball.x+3,ball.y+4,R+1,'#3f302d50');const g=ctx.createRadialGradient(ball.x-4,ball.y-4,1,ball.x,ball.y,R);g.addColorStop(0,'#fff');g.addColorStop(.22,'#d4f1ff');g.addColorStop(.55,'#6ba7c2');g.addColorStop(1,'#1b4d66');circle(ball.x,ball.y,R,g);}
function frame(t){if(!document.hidden){accumulator+=Math.min((t-last)/1000,.05);while(accumulator>=1/120){step(1/120);accumulator-=1/120;}draw();clock.textContent=elapsed.toFixed(1)+'초';}last=t;requestAnimationFrame(frame);}
function move(e){if(e.pointerId!==pointer)return;const rect=pad.getBoundingClientRect(),max=rect.width*.3;let x=(e.clientX-rect.left-rect.width/2)/max,y=(e.clientY-rect.top-rect.height/2)/max,n=Math.hypot(x,y);if(n>1){x/=n;y/=n;}axis={x,y};stick.style.transform=`translate(${x*max}px,${y*max}px)`;}
function release(){pointer=null;axis={x:0,y:0};stick.style.transform='';}
pad.addEventListener('pointerdown',e=>{if(pointer!==null)return;pointer=e.pointerId;pad.setPointerCapture(pointer);move(e);});pad.addEventListener('pointermove',move);for(const event of ['pointerup','pointercancel','lostpointercapture'])pad.addEventListener(event,e=>{if(e.pointerId===pointer)release();});
window.addEventListener('keydown',e=>{if(e.key.startsWith('Arrow')){e.preventDefault();keys.add(e.key);}});window.addEventListener('keyup',e=>keys.delete(e.key));window.addEventListener('blur',()=>{keys.clear();release();});document.addEventListener('visibilitychange',()=>{keys.clear();release();sensor={x:0,y:0};neutral=null;accumulator=0;});
function orientation(e){if(!motion||e.beta===null||e.gamma===null)return;const angle=(screen.orientation?.angle??window.orientation??0)*Math.PI/180;const x=e.gamma*Math.cos(angle)+e.beta*Math.sin(angle),y=e.beta*Math.cos(angle)-e.gamma*Math.sin(angle);if(!neutral){neutral={x,y};hint.textContent='지금 자세를 중심으로 맞췄어. 휴대폰을 천천히 기울여봐.';}sensor={x:clamp((x-neutral.x)/22,-1,1),y:clamp((y-neutral.y)/22,-1,1)};}
window.addEventListener('deviceorientation',orientation);window.addEventListener('orientationchange',()=>{neutral=null;sensor={x:0,y:0};});
document.querySelector('#motion').onclick=async()=>{if(motion){motion=false;sensor={x:0,y:0};document.querySelector('#motion').textContent='기울여서 조작';hint.textContent='터치 패드 또는 방향키로 움직여봐.';return;}try{if(!window.DeviceOrientationEvent)throw Error();if(typeof DeviceOrientationEvent.requestPermission==='function'){const permission=await DeviceOrientationEvent.requestPermission();if(permission!=='granted')throw Error();}motion=true;neutral=null;document.querySelector('#motion').textContent='터치로 전환';hint.textContent='휴대폰을 편하게 들고 잠깐 기다려줘.';setTimeout(()=>{if(motion&&!neutral){motion=false;document.querySelector('#motion').textContent='기울여서 조작';hint.textContent='기울기 신호를 받지 못했어. 터치 패드로 플레이해줘.';}},2500);}catch{hint.textContent='기울기 사용이 허용되지 않았어. 터치 패드로 플레이할 수 있어.';}};
document.querySelector('#reset').onclick=reset;document.querySelector('#again').onclick=reset;reset();requestAnimationFrame(frame);
</script></html>
