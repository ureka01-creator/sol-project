<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#111827">
<title>포켓몬 주사위 배틀 V1.8</title>
<style>
:root{--bg:#f3f6fb;--card:#fff;--ink:#172033;--muted:#667085;--line:#e5e7eb;--blue:#2563eb;--red:#ef4444;--green:#16a34a}
*{box-sizing:border-box} body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo",sans-serif;background:linear-gradient(#dff3ff,#f8fafc 45%,#eef2f7);color:var(--ink);min-height:100vh}
.app{max-width:760px;margin:auto;padding:calc(10px + env(safe-area-inset-top)) 12px calc(30px + env(safe-area-inset-bottom))}
h1{font-size:25px;text-align:center;margin:6px}.sub{text-align:center;color:var(--muted);font-size:13px;margin-bottom:12px}
.card{background:#fff;border-radius:20px;padding:14px;margin:12px 0;box-shadow:0 8px 25px #0f172a14}
.hidden{display:none!important}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.pick{border:2px solid transparent;background:#f8fafc;color:var(--ink);padding:10px;border-radius:16px;text-align:center}
.pick.selected{border-color:#2563eb;background:#eff6ff}.pick img{height:110px;max-width:100%;object-fit:contain;display:block;margin:auto}.pick b{display:block;font-size:17px}
button{border:0;border-radius:14px;padding:13px;font-size:15px;font-weight:800;background:#172033;color:#fff}.wide{width:100%;margin-top:10px}.blue{background:#2563eb}.green{background:#16a34a}.orange{background:#ea580c}.gray{background:#64748b}button:disabled{opacity:.35}
.arena{display:grid;grid-template-columns:1fr 42px 1fr;gap:8px;align-items:center}.fighter{background:#fff;border-radius:18px;padding:10px;text-align:center;min-height:230px}.fighter img{width:100%;height:135px;object-fit:contain}.vs{text-align:center;font-weight:900;color:#94a3b8}
.name{font-size:19px;font-weight:900}.type{font-size:12px;color:#64748b}.hpbar{height:13px;background:#e5e7eb;border-radius:20px;overflow:hidden;margin:6px 0}.hp{height:100%;background:#22c55e;transition:.3s}.hptext{font-size:12px}
.dice{display:flex;justify-content:center;gap:9px;margin:10px}.die{width:64px;height:64px;border:2px solid #dbe3ee;border-radius:15px;display:grid;place-items:center;font-size:30px;font-weight:900;background:#fff}.die.keep{border-color:#2563eb;background:#eff6ff}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:9px}.skill{min-height:58px}.skill small{display:block;font-weight:500;opacity:.85;margin-top:3px}
.teams{display:flex;gap:6px;flex-wrap:wrap}.chip{font-size:11px;background:#f1f5f9;padding:6px 8px;border-radius:999px}.dead{opacity:.35;text-decoration:line-through}
.log{background:#0f172a;color:#e5e7eb;border-radius:14px;padding:11px;min-height:80px;white-space:pre-line;font-size:13px;line-height:1.45;margin-top:10px}
.turn{text-align:center;font-size:18px;font-weight:900;margin-bottom:8px}.notice{font-size:12px;color:#64748b;line-height:1.45}

/* V1.8 UX */
.turn-banner{
  position:fixed;left:50%;top:42%;transform:translate(-50%,-50%) scale(.85);
  z-index:9999;padding:18px 28px;border-radius:22px;color:#fff;font-weight:1000;
  font-size:28px;letter-spacing:.5px;opacity:0;pointer-events:none;
  box-shadow:0 18px 50px #0005;transition:.18s
}
.turn-banner.show{opacity:1;transform:translate(-50%,-50%) scale(1)}
.turn-banner.blue{background:#2563eb}.turn-banner.red{background:#ef4444}

.fighter.active-blue{outline:4px solid #2563eb;box-shadow:0 0 0 7px #2563eb22,0 12px 35px #2563eb33}
.fighter.active-red{outline:4px solid #ef4444;box-shadow:0 0 0 7px #ef444422,0 12px 35px #ef444433}
.fighter.inactive{filter:saturate(.82) brightness(.93)}
.turn-strip{border-radius:14px;padding:10px 12px;text-align:center;font-weight:1000;font-size:17px;margin:10px 0;color:#fff}
.turn-strip.blue{background:#2563eb}.turn-strip.red{background:#ef4444}

@keyframes hitShake{0%,100%{transform:translateX(0)}20%{transform:translateX(-10px) rotate(-1deg)}40%{transform:translateX(9px) rotate(1deg)}60%{transform:translateX(-7px)}80%{transform:translateX(5px)}}
.hit-shake{animation:hitShake .42s ease}
.hit-flash{position:absolute;inset:0;border-radius:18px;background:#ef444455;opacity:0;pointer-events:none}
.hit-flash.on{animation:flash .36s ease}
@keyframes flash{0%{opacity:0}30%{opacity:.9}100%{opacity:0}}
.fighter{position:relative;overflow:hidden}
.damage-pop{
 position:absolute;left:50%;top:42%;transform:translate(-50%,0);
 font-size:31px;font-weight:1000;color:#dc2626;text-shadow:0 2px 0 #fff,0 3px 12px #0004;
 pointer-events:none;z-index:10;animation:damageUp .85s ease forwards
}
@keyframes damageUp{0%{opacity:0;transform:translate(-50%,10px) scale(.7)}20%{opacity:1;transform:translate(-50%,-3px) scale(1.15)}100%{opacity:0;transform:translate(-50%,-55px) scale(.95)}}
.effect-layer{position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:8}
.fx{position:absolute;font-size:32px;animation:flyFx .55s ease forwards}
@keyframes flyFx{0%{opacity:0;transform:translate(-25px,20px) scale(.5) rotate(-15deg)}20%{opacity:1}100%{opacity:0;transform:translate(35px,-25px) scale(1.25) rotate(15deg)}}
.super-text{
 position:fixed;left:50%;top:31%;transform:translate(-50%,-50%) scale(.8);z-index:9998;
 font-weight:1000;font-size:25px;color:#f59e0b;text-shadow:0 2px 0 #fff,0 4px 20px #0005;
 opacity:0;pointer-events:none
}
.super-text.show{animation:superPop .95s ease}
@keyframes superPop{0%{opacity:0;transform:translate(-50%,-50%) scale(.6)}20%{opacity:1;transform:translate(-50%,-50%) scale(1.15)}75%{opacity:1}100%{opacity:0;transform:translate(-50%,-65%) scale(1)}}

.top-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
.dex-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.dex-card{background:#f8fafc;border:1px solid #e5e7eb;border-radius:16px;padding:10px}
.dex-card img{width:100%;height:105px;object-fit:contain}
.dex-card h3{margin:4px 0 2px;font-size:17px}
.dex-card .move{font-size:12px;line-height:1.4;background:#fff;border-radius:10px;padding:7px;margin-top:6px}
.dex-card .stat{font-size:12px;color:#64748b}
.modal{
 position:fixed;inset:0;background:#0f172acc;z-index:9000;padding:calc(18px + env(safe-area-inset-top)) 12px calc(18px + env(safe-area-inset-bottom));
 overflow:auto
}
.modal-inner{max-width:760px;margin:auto;background:#fff;border-radius:22px;padding:14px}
.modal-head{display:flex;align-items:center;justify-content:space-between;gap:10px;position:sticky;top:0;background:#fff;padding:5px 0 10px;z-index:2}
.modal-head h2{margin:0}
.close-btn{background:#334155;padding:10px 14px}


/* V1.8 battle feel */
@keyframes pokeHitBig{
  0%{transform:translate(0,0) scale(1)}
  12%{transform:translate(-18px,-3px) rotate(-4deg) scale(1.05)}
  24%{transform:translate(20px,3px) rotate(4deg) scale(.96)}
  38%{transform:translate(-15px,0) rotate(-3deg) scale(1.04)}
  52%{transform:translate(13px,2px) rotate(2deg) scale(.98)}
  68%{transform:translate(-8px,0) rotate(-1deg)}
  84%{transform:translate(5px,0)}
  100%{transform:translate(0,0) scale(1)}
}
.poke-hit-big{animation:pokeHitBig .62s cubic-bezier(.2,.8,.2,1)}
@keyframes cardImpact{
  0%,100%{transform:translate(0,0)}
  20%{transform:translate(-8px,2px)}
  40%{transform:translate(7px,-2px)}
  60%{transform:translate(-5px,1px)}
  80%{transform:translate(3px,0)}
}
.card-impact{animation:cardImpact .48s ease}
.hit-flash.on{animation:flashStrong .48s ease}
@keyframes flashStrong{0%{opacity:0}18%{opacity:1;background:#ff1f1f99}55%{opacity:.55}100%{opacity:0}}
.damage-pop{font-size:42px!important;color:#ef4444!important;text-shadow:0 3px 0 #fff,0 6px 20px #0007!important}
.fx{font-size:42px!important}

@keyframes diceRoll{
  0%{transform:scale(1) rotate(0)}
  20%{transform:scale(1.28) rotate(-12deg)}
  45%{transform:scale(1.42) rotate(15deg)}
  70%{transform:scale(1.22) rotate(-8deg)}
  100%{transform:scale(1) rotate(0)}
}
.die.rolling{animation:diceRoll .65s cubic-bezier(.2,.8,.2,1);box-shadow:0 12px 30px #2563eb44;border-color:#2563eb}

.switch-modal{
 position:fixed;inset:0;background:#0f172acc;z-index:9500;
 display:flex;align-items:center;justify-content:center;padding:18px
}
.switch-box{width:min(520px,100%);background:white;border-radius:22px;padding:16px;box-shadow:0 25px 70px #0007}
.switch-box h2{margin:0 0 10px}
.switch-list{display:grid;gap:9px}
.switch-choice{
 display:grid;grid-template-columns:68px 1fr auto;gap:10px;align-items:center;
 width:100%;background:#f8fafc;color:#172033;border:2px solid #e5e7eb;text-align:left
}
.switch-choice img{width:64px;height:64px;object-fit:contain}
.switch-choice .meta{font-size:12px;color:#64748b;margin-top:3px}
.switch-choice .hpmini{font-size:12px;font-weight:800}


/* V1.8 */
.difficulty-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.diff-btn{background:#f8fafc;color:#172033;border:2px solid #e5e7eb;min-height:105px}
.diff-btn b{display:block;font-size:17px;margin-top:6px}.diff-btn small{display:block;color:#64748b;margin-top:3px}

.difficulty-badge{font-weight:900;margin-left:5px}

.skill.unavailable{filter:grayscale(.75);opacity:.28!important;transform:none!important}
.skill.available{box-shadow:0 0 0 3px #ffffff55 inset}

@keyframes diceRollXL{
  0%{transform:scale(1) rotate(0)}
  18%{transform:scale(1.7) rotate(-25deg)}
  38%{transform:scale(1.95) rotate(30deg)}
  58%{transform:scale(1.72) rotate(-22deg)}
  78%{transform:scale(1.48) rotate(14deg)}
  100%{transform:scale(1) rotate(0)}
}
.die.rolling{animation:diceRollXL .9s cubic-bezier(.15,.8,.2,1)!important;z-index:20;box-shadow:0 22px 45px #2563eb66!important}
.dice{position:relative;min-height:82px;align-items:center}
@keyframes diceAreaPulse{0%{transform:scale(1)}45%{transform:scale(1.06)}100%{transform:scale(1)}}
.dice.burst{animation:diceAreaPulse .9s ease}

.victory-overlay{position:fixed;inset:0;z-index:12000;background:#0f172ae8;display:flex;align-items:center;justify-content:center;padding:20px}
.victory-card{width:min(560px,100%);text-align:center;border-radius:30px;padding:34px 20px;background:linear-gradient(180deg,#fff,#f8fafc);box-shadow:0 30px 90px #0009;animation:victoryIn .55s cubic-bezier(.15,.9,.2,1)}
.victory-trophy{font-size:76px;animation:trophyBounce 1s ease infinite alternate}
.victory-title{font-size:42px;font-weight:1000;margin:8px 0}
.victory-team{font-size:25px;font-weight:900;margin-bottom:16px}
@keyframes victoryIn{0%{opacity:0;transform:scale(.55) rotate(-3deg)}100%{opacity:1;transform:scale(1) rotate(0)}}
@keyframes trophyBounce{from{transform:translateY(0) rotate(-4deg)}to{transform:translateY(-10px) rotate(4deg)}}


.ball-img{
  width:68px;height:68px;object-fit:contain;display:block;margin:0 auto 4px;
  image-rendering:auto;filter:drop-shadow(0 6px 9px #0003)
}
@keyframes diceLock{
  0%{transform:scale(1);box-shadow:0 0 0 #0000}
  35%{transform:scale(1.55);box-shadow:0 0 0 8px #facc1544,0 18px 35px #0003}
  62%{transform:scale(.9)}
  100%{transform:scale(1);box-shadow:0 0 0 3px #22c55e55,0 6px 18px #0002}
}
.die.locked{animation:diceLock .38s cubic-bezier(.2,.9,.2,1);border-color:#22c55e;background:#f0fdf4}
.die.locked::after{
  content:"✓";position:absolute;right:-8px;top:-11px;width:24px;height:24px;border-radius:50%;
  background:#16a34a;color:#fff;font-size:15px;display:grid;place-items:center;border:2px solid #fff;
  animation:lockCheck .38s ease
}
.die{position:relative}
@keyframes lockCheck{0%{opacity:0;transform:scale(.2)}60%{opacity:1;transform:scale(1.25)}100%{transform:scale(1)}}


/* V1.8 */
@keyframes diceRollFast{
  0%{transform:scale(1) rotate(0)}
  30%{transform:scale(1.48) rotate(-22deg)}
  60%{transform:scale(1.58) rotate(24deg)}
  100%{transform:scale(1.1) rotate(-8deg)}
}
.die.rolling{
  animation:diceRollFast .46s linear!important;
  z-index:20;
  box-shadow:0 16px 34px #2563eb55!important;
}
@keyframes diceLockTogether{
  0%{transform:scale(1.1)}
  38%{transform:scale(1.48);box-shadow:0 0 0 8px #facc154c,0 18px 35px #0003}
  68%{transform:scale(.92)}
  100%{transform:scale(1);box-shadow:0 0 0 3px #22c55e55,0 7px 18px #0002}
}
.die.locked{animation:diceLockTogether .32s cubic-bezier(.18,.9,.2,1)!important;border-color:#22c55e;background:#f0fdf4}
.die.locked::after{content:"✓";position:absolute;right:-8px;top:-11px;width:24px;height:24px;border-radius:50%;background:#16a34a;color:#fff;font-size:15px;display:grid;place-items:center;border:2px solid #fff}

.team-panels{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.team-panel{border-radius:16px;padding:10px;background:#f8fafc;border:2px solid #e5e7eb}
.team-panel.blue-team{border-color:#93c5fd;background:#eff6ff}
.team-panel.red-team{border-color:#fca5a5;background:#fff1f2}
.team-title{font-size:14px;font-weight:1000;margin-bottom:8px}
.team-mon{display:grid;grid-template-columns:48px 1fr;gap:8px;align-items:center;padding:7px;background:#fff;border-radius:12px;margin-top:7px;border:2px solid transparent;position:relative}
.team-mon.active-mon{border-color:#22c55e;box-shadow:0 0 0 3px #22c55e18}
.team-mon.fainted-mon{opacity:.38;filter:grayscale(1)}
.team-mon img{width:46px;height:46px;object-fit:contain}
.team-mon-name{font-size:12px;font-weight:900;display:flex;align-items:center;justify-content:space-between;gap:4px}
.team-mon-type{font-size:10px;color:#64748b;margin:2px 0 4px}
.team-hpbar{height:7px;background:#e5e7eb;border-radius:999px;overflow:hidden}
.team-hpfill{height:100%;background:#22c55e;border-radius:999px}
.team-hptext{font-size:9px;color:#475569;margin-top:3px}
.active-tag{font-size:9px;padding:2px 5px;border-radius:999px;background:#16a34a;color:#fff;white-space:nowrap}
.fainted-tag{font-size:9px;padding:2px 5px;border-radius:999px;background:#64748b;color:#fff;white-space:nowrap}
@media(max-width:520px){
  .team-panels{grid-template-columns:1fr}
  .team-mon{grid-template-columns:44px 1fr}
}


/* V1.8 dice polish */
@keyframes diceLockYellow{
  0%{transform:scale(1.08);background:#fff;border-color:#dbe3ee}
  35%{transform:scale(1.85);background:#fef9c3;border-color:#facc15;box-shadow:0 0 0 10px #facc1540,0 22px 45px #0004}
  65%{transform:scale(1.15);background:#fefce8;border-color:#eab308}
  100%{transform:scale(1);background:#fff;border-color:#dbe3ee;box-shadow:0 6px 14px #0f172a14}
}
.die.locked{
  animation:diceLockYellow .46s cubic-bezier(.2,.9,.2,1)!important;
  border-color:#facc15!important;
  background:#fef9c3!important;
}
.die.locked::after{
  content:"";display:none!important;
}
.dice.cpu-rolling::before{
  content:"🤖 컴퓨터 주사위!";
  position:absolute;left:50%;top:-24px;transform:translateX(-50%);
  font-size:12px;font-weight:900;color:#475569;white-space:nowrap
}

</style></head>
<body><div id="turnBanner" class="turn-banner"></div><div id="superText" class="super-text">효과가 굉장했다!</div><div class="app">
<h1>⚡ 포켓몬 주사위 배틀</h1><div id="subtitle" class="sub">게임 모드를 선택해</div>
<div class="top-actions">
  <button class="gray" onclick="openDex()">📘 포켓몬 도감</button>
  <button onclick="location.reload()">🔄 새 게임</button>
</div>



<section id="modeScreen" class="card">
 <h2 style="margin-top:0">🎮 플레이 모드</h2>
 <div class="actions">
  <button class="skill blue" onclick="chooseMode('solo')">🤖 혼자 플레이<small>블루팀 vs 컴퓨터</small></button>
  <button class="skill orange" onclick="chooseMode('two')">👥 2인 플레이<small>블루팀 vs 레드팀</small></button>
 </div>
</section>

<section id="difficultyScreen" class="card hidden">
 <h2 style="margin-top:0">🤖 AI 난이도 선택</h2>
 <div class="difficulty-grid">
  <button class="diff-btn" onclick="chooseDifficulty(0)"><img class="ball-img" src="poke-ball.png"><b>몬스터볼</b><small>쉬움</small></button>
  <button class="diff-btn" onclick="chooseDifficulty(1)"><img class="ball-img" src="great-ball.png"><b>슈퍼볼</b><small>보통</small></button>
  <button class="diff-btn" onclick="chooseDifficulty(2)"><img class="ball-img" src="ultra-ball.png"><b>하이퍼볼</b><small>어려움</small></button>
  <button class="diff-btn" onclick="chooseDifficulty(3)"><img class="ball-img" src="master-ball.png"><b>마스터볼</b><small>아주 어려움</small></button>
 </div>
 <button class="wide gray" onclick="backToMode()">뒤로</button>
</section>

<section id="selectScreen" class="card hidden">
 <h2 style="margin-top:0">① 포켓몬을 골라!</h2>
 <div id="pickTitle" class="turn">블루팀 · 3마리 선택</div>
 <div id="pickGrid" class="grid"></div>
 <button id="confirmPick" class="wide blue" disabled>선택 완료</button>
 
</section>

<section id="gameScreen" class="hidden">
 <div id="turnStrip" class="turn-strip blue">🔵 블루팀의 차례</div>
 <div id="turnText" class="turn"></div>
 <div class="arena">
  <div class="fighter" id="fighter0"><div class="hit-flash"></div><div class="effect-layer"></div><div id="p1name" class="name"></div><div id="p1type" class="type"></div><img id="p1img"><div class="hpbar"><div id="p1hp" class="hp"></div></div><div id="p1hptext" class="hptext"></div></div>
  <div class="vs">VS</div>
  <div class="fighter" id="fighter1"><div class="hit-flash"></div><div class="effect-layer"></div><div id="p2name" class="name"></div><div id="p2type" class="type"></div><img id="p2img"><div class="hpbar"><div id="p2hp" class="hp"></div></div><div id="p2hptext" class="hptext"></div></div>
 </div>

 <div class="card">
  <b>🎲 주사위 3개</b><div class="notice">주사위를 누르면 보관/해제할 수 있어. 보관한 주사위는 다음 턴에도 남아.</div>
  <div class="dice"><div class="die" data-i="0">?</div><div class="die" data-i="1">?</div><div class="die" data-i="2">?</div></div>
  <button id="roll" class="wide blue">주사위 굴리기</button>
 </div>

 <div class="card">
  <div class="actions">
   <button id="skill1" class="skill gray"></button>
   <button id="skill2" class="skill orange"></button>
   <button id="switch" class="skill green">🔄 포켓몬 교체<small>공격 대신 교체</small></button>
   <button id="pass" class="skill">턴 넘기기<small>주사위 보관</small></button>
  </div>
  <div id="log" class="log"></div>
 </div>

 <div class="card">
  <b>팀 상태</b>
  <div id="teams" class="team-panels"></div>
  <button class="wide" onclick="location.reload()">처음부터</button>
 </div>
</section>
</div>

<div id="dexModal" class="modal hidden">
 <div class="modal-inner">
  <div class="modal-head"><h2>📘 포켓몬 도감</h2><button class="close-btn" onclick="closeDex()">닫기</button></div>
  <div class="notice" style="margin-bottom:10px">HP, 타입, 기술과 주사위 조건을 한눈에 볼 수 있어.</div>
  <div id="dexGrid" class="dex-grid"></div>
 </div>
</div>



<div id="victoryOverlay" class="victory-overlay hidden">
 <div class="victory-card">
   <div class="victory-trophy">🏆</div>
   <div class="victory-title">VICTORY!</div>
   <div id="victoryTeam" class="victory-team"></div>
   <button class="wide blue" onclick="location.reload()">다시 플레이</button>
 </div>
</div>

<div id="switchModal" class="switch-modal hidden">
 <div class="switch-box">
  <h2>🔄 교체할 포켓몬 선택</h2>
  <div id="switchList" class="switch-list"></div>
  <button class="wide gray" onclick="closeSwitchModal()">취소</button>
 </div>
</div>

<script>
const P=[
 {id:25,n:"피카츄",t:"전기",hp:60,s1:["전광석화",10,1,"아무 주사위 1개"],s2:["10만볼트",30,2,"합계 10 이상"]},
 {id:4,n:"파이리",t:"불꽃",hp:55,s1:["할퀴기",10,1,"아무 주사위 1개"],s2:["불꽃세례",25,2,"4 이상 2개"]},
 {id:7,n:"꼬부기",t:"물",hp:70,s1:["물대포",15,1,"아무 주사위 1개"],s2:["아쿠아테일",28,2,"짝수 2개"]},
 {id:1,n:"이상해씨",t:"풀",hp:70,s1:["덩굴채찍",15,1,"아무 주사위 1개"],s2:["씨폭탄",28,2,"합계 8 이상"]},
 {id:92,n:"고오스",t:"고스트",hp:50,s1:["핥기",12,1,"홀수 1개"],s2:["나이트헤드",28,2,"같은 눈 2개"]},
 {id:143,n:"잠만보",t:"노말",hp:100,s1:["몸통박치기",14,1,"아무 주사위 1개"],s2:["기가임팩트",35,3,"주사위 3개"]}
];
const LOCAL_IMAGES={
  25:"pikachu.png",
  4:"charmander.png",
  7:"squirtle.png",
  1:"bulbasaur.png",
  92:"gastly.png",
  143:"snorlax.png"
};
const img=id=>LOCAL_IMAGES[id];
let selecting=0, picks=[[],[]], selected=[], teams=[],active=[0,0],turn=0,over=false,gameMode=null,aiBusy=false,aiDifficulty=1;
let turnDice=[[null,null,null],[null,null,null]];
let turnKept=[[false,false,false],[false,false,false]];
let turnRolled=[false,false];
function diceNow(){return turnDice[turn]}
function keptNow(){return turnKept[turn]}
function rolledNow(){return turnRolled[turn]}
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];

function chooseMode(mode){
 gameMode=mode;
 $("#modeScreen").classList.add("hidden");
 if(mode==="solo"){
   $("#difficultyScreen").classList.remove("hidden");
   $("#subtitle").textContent="🤖 AI 난이도를 선택해";
 }else{
   $("#selectScreen").classList.remove("hidden");
   $("#subtitle").textContent="🔵 블루팀 vs 🔴 레드팀 · 2인용";
   selecting=0; selected=[]; picks=[[],[]]; pickRender();
 }
}
function backToMode(){
 $("#difficultyScreen").classList.add("hidden");
 $("#modeScreen").classList.remove("hidden");
 $("#subtitle").textContent="게임 모드를 선택해";
}
function difficultyName(){
 return ["몬스터볼 · 쉬움","슈퍼볼 · 보통","하이퍼볼 · 어려움","마스터볼 · 아주 어려움"][aiDifficulty];
}
function chooseDifficulty(level){
 aiDifficulty=level;
 $("#difficultyScreen").classList.add("hidden");
 $("#selectScreen").classList.remove("hidden");
 $("#subtitle").innerHTML=`🔵 블루팀 vs 🤖 컴퓨터 <span class="difficulty-badge">${difficultyName()}</span>`;
 selecting=0; selected=[]; picks=[[],[]]; pickRender();
}
function typeAdv(att,def){
 return (att==="불꽃"&&def==="풀")||(att==="풀"&&def==="물")||(att==="물"&&def==="불꽃");
}
function chooseAiTeam(){
 if(aiDifficulty<3)return randomAiTeam();
 const playerTypes=picks[0].map(i=>P[i].t);
 const scored=P.map((p,i)=>{
   let score=p.hp/25 + p.s2[1]/10;
   playerTypes.forEach(t=>{if(typeAdv(p.t,t))score+=4;if(typeAdv(t,p.t))score-=1.5});
   return [i,score+Math.random()*.25];
 }).sort((a,b)=>b[1]-a[1]);
 return scored.slice(0,3).map(x=>x[0]);
}
function randomAiTeam(){
 const ids=P.map((_,i)=>i);
 for(let i=ids.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[ids[i],ids[j]]=[ids[j],ids[i]]}
 return ids.slice(0,3);
}
function isAiTurn(){return gameMode==="solo"&&turn===1&&!over}

function pickRender(){
 $("#pickTitle").textContent=gameMode==="solo"?"블루팀 · 3마리 선택":(selecting===0?"블루팀":"레드팀")+" 팀 · 3마리 선택";
 $("#pickGrid").innerHTML=P.map((p,i)=>`<button class="pick ${selected.includes(i)?"selected":""}" data-p="${i}"><img src="${img(p.id)}"><b>${p.n}</b><span>${p.t} · HP ${p.hp}</span></button>`).join("");
 $$(".pick").forEach(b=>b.onclick=()=>{let i=+b.dataset.p;if(selected.includes(i))selected=selected.filter(x=>x!==i);else if(selected.length<3)selected.push(i);pickRender()});
 $("#confirmPick").disabled=selected.length!==3;
}
$("#confirmPick").onclick=()=>{
 picks[selecting]=[...selected];selected=[];
 if(gameMode==="solo"){picks[1]=chooseAiTeam();start();return;}
 if(selecting===0){selecting=1;pickRender()}else start()
};
function start(){teams=picks.map(a=>a.map(i=>({...P[i],cur:P[i].hp})));$("#selectScreen").classList.add("hidden");$("#gameScreen").classList.remove("hidden");log(gameMode==="solo"?"배틀 시작! 블루팀부터 시작!":"배틀 시작! 블루팀부터 주사위를 굴려.");render();showTurnBanner()}
function log(t){const el=$("#log"); if(el) el.textContent=t;}

function showTurnBanner(){
 const el=$("#turnBanner");
 el.textContent=turn===0?"🔵 BLUE TEAM TURN":(gameMode==="solo"?"🤖 COMPUTER TURN":"🔴 RED TEAM TURN");
 el.className="turn-banner "+(turn===0?"blue":"red")+" show";
 setTimeout(()=>el.classList.remove("show"),800);
}
function updateTurnUX(){
 const strip=$("#turnStrip");
 if(strip){strip.textContent=turn===0?"🔵 블루팀의 차례":(gameMode==="solo"?`🤖 컴퓨터의 차례 · ${difficultyName()}`:"🔴 레드팀의 차례");strip.className="turn-strip "+(turn===0?"blue":"red")}
 const f0=$("#fighter0"),f1=$("#fighter1");
 if(f0&&f1){
   f0.className="fighter "+(turn===0?"active-blue":"inactive");
   f1.className="fighter "+(turn===1?"active-red":"inactive");
 }
}
function typeFx(type){
 return {"전기":"⚡","불꽃":"🔥","물":"💧","풀":"🍃","고스트":"👻","노말":"💥"}[type]||"✨";
}
function playHitEffect(target, dmg, type, superHit=false){
 const f=$("#fighter"+target);
 if(!f)return;
 const pokeImg=f.querySelector("img");
 f.classList.remove("card-impact"); void f.offsetWidth; f.classList.add("card-impact");
 if(pokeImg){pokeImg.classList.remove("poke-hit-big");void pokeImg.offsetWidth;pokeImg.classList.add("poke-hit-big");}
 const flash=f.querySelector(".hit-flash"); flash.classList.remove("on"); void flash.offsetWidth; flash.classList.add("on");
 const pop=document.createElement("div"); pop.className="damage-pop"; pop.textContent="-"+dmg; f.appendChild(pop); setTimeout(()=>pop.remove(),900);
 const layer=f.querySelector(".effect-layer");
 for(let i=0;i<5;i++){
   const fx=document.createElement("div"); fx.className="fx"; fx.textContent=typeFx(type);
   fx.style.left=(12+Math.random()*65)+"%"; fx.style.top=(28+Math.random()*42)+"%";
   fx.style.animationDelay=(i*45)+"ms"; layer.appendChild(fx); setTimeout(()=>fx.remove(),900);
 }
 if(superHit){
   const s=$("#superText"); s.classList.remove("show"); void s.offsetWidth; s.classList.add("show");
 }
}
function openDex(){
 $("#dexGrid").innerHTML=P.map(p=>`
  <div class="dex-card">
   <img src="${img(p.id)}" alt="${p.n}">
   <h3>${p.n}</h3><div class="stat">${p.t} 타입 · HP ${p.hp}</div>
   <div class="move"><b>${p.s1[0]}</b> · 피해 ${p.s1[1]}<br>${p.s1[3]}</div>
   <div class="move"><b>${p.s2[0]}</b> · 피해 ${p.s2[1]}<br>${p.s2[3]}</div>
  </div>`).join("");
 $("#dexModal").classList.remove("hidden");
}
function closeDex(){ $("#dexModal").classList.add("hidden"); }

function cur(x){return teams[x][active[x]]}
function render(){
 let a=cur(0),b=cur(1); $("#p1name").textContent="블루팀 · "+a.n;$("#p2name").textContent=(gameMode==="solo"?"컴퓨터":"레드팀")+" · "+b.n;$("#p1type").textContent=a.t+" 타입";$("#p2type").textContent=b.t+" 타입";$("#p1img").src=img(a.id);$("#p2img").src=img(b.id);
 [["p1",a],["p2",b]].forEach(([x,p])=>{$("#"+x+"hp").style.width=(p.cur/p.hp*100)+"%";$("#"+x+"hptext").textContent=`HP ${p.cur} / ${p.hp}`});
 $("#turnText").textContent=(turn===0?"🔵 블루팀":(gameMode==="solo"?"🤖 컴퓨터":"🔴 레드팀"))+" 차례"; updateTurnUX();
 let me=cur(turn);$("#skill1").innerHTML=`${me.s1[0]} · ${me.s1[1]}<small>${me.s1[3]}</small>`;$("#skill2").innerHTML=`${me.s2[0]} · ${me.s2[1]}<small>${me.s2[3]}</small>`;
 $$(".die").forEach((d,i)=>{d.textContent=diceNow()[i]??"?";d.classList.toggle("keep",keptNow()[i])});
 $("#teams").innerHTML=teams.map((tm,x)=>{
   const teamName=x===0?"🔵 블루팀":(gameMode==="solo"?"🤖 컴퓨터":"🔴 레드팀");
   return `<div class="team-panel ${x===0?"blue-team":"red-team"}">
     <div class="team-title">${teamName}</div>
     ${tm.map((p,i)=>{
       const pct=Math.max(0,p.cur/p.hp*100);
       const activeNow=i===active[x]&&p.cur>0;
       const fainted=p.cur<=0;
       return `<div class="team-mon ${activeNow?"active-mon":""} ${fainted?"fainted-mon":""}">
         <img src="${img(p.id)}" alt="${p.n}">
         <div>
           <div class="team-mon-name"><span>${p.n}</span>${activeNow?'<span class="active-tag">출전 중</span>':(fainted?'<span class="fainted-tag">기절</span>':'')}</div>
           <div class="team-mon-type">${p.t} 타입</div>
           <div class="team-hpbar"><div class="team-hpfill" style="width:${pct}%"></div></div>
           <div class="team-hptext">HP ${p.cur} / ${p.hp}</div>
         </div>
       </div>`;
     }).join("")}
   </div>`;
 }).join("");
 const ai=isAiTurn();
 $("#roll").disabled=rolledNow()||over||ai;
 const s1ok=rolledNow()&&valid(me.s1), s2ok=rolledNow()&&valid(me.s2);
 $("#skill1").disabled=!s1ok||over||ai; $("#skill2").disabled=!s2ok||over||ai;
 $("#skill1").classList.toggle("unavailable",!s1ok); $("#skill2").classList.toggle("unavailable",!s2ok);
 $("#skill1").classList.toggle("available",s1ok); $("#skill2").classList.toggle("available",s2ok);
 $("#switch").disabled=over||ai;$("#pass").disabled=over||ai;
}

function lockInDice(diceEls,onDone){
  const activeIndexes=[0,1,2].filter(i=>!keptNow()[i]);
  if(!activeIndexes.length){if(onDone)onDone();return;}
  activeIndexes.forEach(idx=>{
    const d=diceEls[idx];
    d.classList.remove("rolling");
    d.classList.add("locked");
  });
  if(navigator.vibrate)navigator.vibrate(45);
  setTimeout(()=>{
    activeIndexes.forEach(idx=>diceEls[idx].classList.remove("locked"));
    if(onDone)onDone();
  },360);
}


function animateDiceRoll(forTurn,onDone){
  const diceEls=$$(".die");
  const diceWrap=$(".dice");
  if(forTurn===1&&gameMode==="solo")diceWrap.classList.add("cpu-rolling");
  diceWrap.classList.add("burst");
  diceEls.forEach((d,i)=>{if(!turnKept[forTurn][i])d.classList.add("rolling")});
  let ticks=0;
  const timer=setInterval(()=>{
    diceEls.forEach((d,i)=>{
      if(!turnKept[forTurn][i])d.textContent=Math.floor(Math.random()*6)+1;
    });
    ticks++;
    if(ticks>=6){
      clearInterval(timer);
      turnDice[forTurn]=turnDice[forTurn].map((v,i)=>turnKept[forTurn][i]?v:Math.floor(Math.random()*6)+1);
      turnRolled[forTurn]=true;
      diceEls.forEach((d,i)=>d.textContent=turnDice[forTurn][i]);
      const activeIndexes=[0,1,2].filter(i=>!turnKept[forTurn][i]);
      activeIndexes.forEach(i=>{
        diceEls[i].classList.remove("rolling");
        diceEls[i].classList.add("locked");
      });
      if(navigator.vibrate)navigator.vibrate(45);
      setTimeout(()=>{
        activeIndexes.forEach(i=>diceEls[i].classList.remove("locked"));
        diceWrap.classList.remove("burst","cpu-rolling");
        render();
        if(onDone)onDone();
      },480);
    }
  },70);
}

$("#roll").onclick=()=>{
  if(rolledNow()||over)return;
  animateDiceRoll(turn,()=>{
    log("🎲 "+diceNow().join(" · ")+" 확정! 기술을 골라.");
  });
};
$$(".die").forEach(d=>d.onclick=()=>{if(!rolledNow())return;let i=+d.dataset.i;turnKept[turn][i]=!turnKept[turn][i];render()});
function valid(skill){
 let vals=diceNow().filter(v=>v!=null),n=skill[0];
 if(n==="전광석화"||n==="할퀴기"||n==="물대포"||n==="덩굴채찍"||n==="몸통박치기")return vals.length>=1;
 
 if(n==="10만볼트")return vals.length>=2&&[...vals].sort((a,b)=>b-a)[0]+[...vals].sort((a,b)=>b-a)[1]>=10;
 if(n==="불꽃세례")return vals.filter(v=>v>=4).length>=2;
 if(n==="아쿠아테일")return vals.filter(v=>v%2===0).length>=2;
 if(n==="씨폭탄")return vals.length>=2&&[...vals].sort((a,b)=>b-a)[0]+[...vals].sort((a,b)=>b-a)[1]>=8;
 if(n==="핥기")return vals.some(v=>v%2===1);
 if(n==="나이트헤드")return new Set(vals).size<vals.length;
 if(n==="기가임팩트")return vals.length===3;
 return true
}
function use(which){if(!rolledNow())return;let me=cur(turn),sk=me[which];if(!valid(sk)){log("❌ "+sk[0]+" 조건이 안 돼! ("+sk[3]+")");return}let enemy=cur(1-turn),dmg=sk[1],mult=1;
 if((me.t==="불꽃"&&enemy.t==="풀")||(me.t==="풀"&&enemy.t==="물")||(me.t==="물"&&enemy.t==="불꽃"))mult=1.5;
 dmg=Math.round(dmg*mult);enemy.cur=Math.max(0,enemy.cur-dmg);log(`💥 ${me.n}의 ${sk[0]}! ${dmg} 피해!${mult>1?" 효과가 굉장했다!":""}`);playHitEffect(1-turn,dmg,me.t,mult>1);turnDice[turn]=[null,null,null];turnKept[turn]=[false,false,false];turnRolled[turn]=false;render();if(enemy.cur<=0)setTimeout(faint,350);else setTimeout(next,450)}
$("#skill1").onclick=()=>use("s1");$("#skill2").onclick=()=>use("s2");

function showVictory(winner){
 $("#victoryTeam").textContent=winner+" 승리!";
 $("#victoryOverlay").classList.remove("hidden");
 if(navigator.vibrate) navigator.vibrate([120,70,180]);
}

function faint(){let x=1-turn,idx=teams[x].findIndex(p=>p.cur>0);if(idx<0){over=true;const winner=(turn===0?"블루팀":(gameMode==="solo"?"컴퓨터":"레드팀"));log("🏆 "+winner+" 승리!!");render();setTimeout(()=>showVictory(winner),500);return}active[x]=idx;log(`😵 쓰러졌다! ${cur(x).n} 출전!`);render();setTimeout(next,500)}
function next(){
  turn=1-turn;
  turnRolled[turn]=false;
  log((turn===0?"🔵 블루팀":(gameMode==="solo"?"🤖 컴퓨터":"🔴 레드팀"))+" 차례! 이 팀이 보관한 주사위는 그대로야.");
  render();showTurnBanner();
  if(isAiTurn()) setTimeout(aiTakeTurn,900);
}
$("#pass").onclick=()=>{if(rolledNow())log("주사위를 보관하고 턴을 넘겼어.");turnRolled[turn]=false;next()};

function aiRoll(onDone){
  animateDiceRoll(1,()=>{
    log("🤖 컴퓨터 주사위: "+turnDice[1].join(" · ")+" 확정!");
    if(onDone)onDone();
  });
}
function aiChooseKeep(){
 const vals=turnDice[1];
 if(aiDifficulty===0){turnKept[1]=vals.map(()=>false);return;}
 if(aiDifficulty===1){turnKept[1]=vals.map(v=>v>=4);return;}
 if(aiDifficulty===2){turnKept[1]=vals.map(v=>v>=4||v===2);return;}
 // Master: keep dice that are broadly valuable for pair/sum conditions
 turnKept[1]=vals.map((v,i)=>v>=4 || vals.some((x,j)=>j!==i&&x===v));
}
function aiBestMove(){
 const me=cur(1);
 const options=[];
 if(valid(me.s1))options.push(["s1",me.s1[1]]);
 if(valid(me.s2))options.push(["s2",me.s2[1]]);
 if(!options.length)return null;
 if(aiDifficulty===0)return options[Math.floor(Math.random()*options.length)][0];
 options.sort((a,b)=>b[1]-a[1]);
 return options[0][0];
}
function aiShouldSwitch(){
 const me=cur(1), enemy=cur(0);
 const alive=teams[1].map((p,i)=>p.cur>0&&i!==active[1]?i:-1).filter(i=>i>=0);
 if(!alive.length||aiDifficulty===0)return false;
 if(aiDifficulty===1)return me.cur<=me.hp*.3 && Math.random()<.25;
 if(aiDifficulty===2){
   if(typeAdv(enemy.t,me.t)&&alive.some(i=>typeAdv(teams[1][i].t,enemy.t)))return true;
   return me.cur<=me.hp*.42&&Math.random()<.5;
 }
 // Master: actively seek favorable matchup, or preserve a weak low-HP active Pokémon.
 if(typeAdv(enemy.t,me.t)&&alive.some(i=>typeAdv(teams[1][i].t,enemy.t)))return true;
 if(alive.some(i=>typeAdv(teams[1][i].t,enemy.t))&&!typeAdv(me.t,enemy.t)&&Math.random()<.55)return true;
 return me.cur<=me.hp*.5&&Math.random()<.7;
}
function aiSwitch(){
 const enemy=cur(0);
 const alive=teams[1].map((p,i)=>p.cur>0&&i!==active[1]?i:-1).filter(i=>i>=0);
 if(!alive.length)return false;
 alive.sort((a,b)=>{
   const pa=teams[1][a],pb=teams[1][b];
   const sa=(typeAdv(pa.t,enemy.t)?50:0)+(pa.cur/pa.hp)*20+pa.s2[1];
   const sb=(typeAdv(pb.t,enemy.t)?50:0)+(pb.cur/pb.hp)*20+pb.s2[1];
   return sb-sa;
 });
 active[1]=aiDifficulty>=2?alive[0]:alive[Math.floor(Math.random()*alive.length)];
 log("🤖 컴퓨터가 "+cur(1).n+"으로 교체!");
 render(); setTimeout(next,650); return true;
}
function aiTakeTurn(){
 if(!isAiTurn()||aiBusy)return;
 aiBusy=true;
 if(aiShouldSwitch()){
   aiBusy=false; aiSwitch(); return;
 }
 log("🤖 컴퓨터가 주사위를 굴린다!");
 aiRoll(()=>{
   setTimeout(()=>{
     let move=aiBestMove();
     if(aiDifficulty===0&&Math.random()<.22)move=null;
     if(move){
       aiBusy=false;
       use(move);
     }else{
       aiChooseKeep();
       log("🤖 기술 조건이 안 돼서 주사위를 보관하고 턴을 넘긴다.");
       render();
       aiBusy=false;
       setTimeout(next,550);
     }
   },350);
 });
}

function openSwitchModal(){
  const alive=teams[turn].map((p,i)=>p.cur>0&&i!==active[turn]?i:-1).filter(i=>i>=0);
  if(!alive.length){log("교체할 포켓몬이 없어!");return;}
  $("#switchList").innerHTML=alive.map(i=>{
    const p=teams[turn][i];
    return `<button class="switch-choice" onclick="chooseSwitch(${i})">
      <img src="${img(p.id)}" alt="${p.n}">
      <div><b>${p.n}</b><div class="meta">${p.t} 타입</div></div>
      <div class="hpmini">HP ${p.cur}/${p.hp}</div>
    </button>`;
  }).join("");
  $("#switchModal").classList.remove("hidden");
}
function closeSwitchModal(){ $("#switchModal").classList.add("hidden"); }
function chooseSwitch(i){
  active[turn]=i; closeSwitchModal();
  log("🔄 "+cur(turn).n+"으로 교체!");
  turnRolled[turn]=false;
  render();
  setTimeout(next,450);
}
$("#switch").onclick=openSwitchModal;
</script></body></html>
